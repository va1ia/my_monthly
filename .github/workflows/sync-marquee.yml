name: Sync marquee logos

on:
  push:
    paths:
      - 'assets/images/home/logo-marquee/**'
      - 'scripts/tools/sync-marquee.py'
      - '.github/workflows/sync-marquee.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marquee-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Generate logo manifest
        run: python3 scripts/tools/sync-marquee.py
      - name: Save generated manifest
        run: |
          if ! git diff --quiet -- content/home/logo-marquee.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/home/logo-marquee.json
            git commit -m "Update generated marquee logo manifest"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
