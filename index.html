<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="My Monthly navigation and footer component preview.">
  <title>My Monthly — Component preview</title>
  <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg">
  <link rel="stylesheet" href="./styles/shared.css">
  <link rel="stylesheet" href="./styles/preview/index.css">
  <script type="module" src="./scripts/preview/index.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>
  <main id="main" class="shell-preview" tabindex="-1">
    <p class="shell-preview__eyebrow">MY MONTHLY / COMPONENT PREVIEW</p>
    <h1>Navigation &amp; footer</h1>
    <p>This space is reserved for your page design.</p>
    <div class="shell-preview__controls">
      <label>Current page<select id="preview-page"><option value="home">Home</option><option value="about">About</option><option value="news">News</option><option value="shop">Shop</option><option value="contact">Contact</option><option value="download">Download</option></select></label>
      <label>Footer background<select id="preview-footer"><option value="brand">Brand green</option><option value="dark">Dark green</option><option value="light">Light</option></select></label>
    </div>
  </main>
  <div id="site-footer"></div>
  <noscript>This component preview requires JavaScript.</noscript>
</body>
</html>
