<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Monthly — Pre-footer animation preview</title>
  <link rel="icon" href="./assets/icons/favicon.svg">
  <link rel="stylesheet" href="./styles/shared.css">
  <link rel="stylesheet" href="./styles/preview/pre-footer.css">
  <script type="module" src="./scripts/preview/pre-footer.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>
  <main id="main" tabindex="-1">
    <div class="pre-footer-test">
      <h1>Pre-footer 动画预览</h1>
      <p>新版字样与叶子同步播放，20 秒循环（叶子每 10 秒循环）；可对照网页视频与原始 JSON。</p>
      <div class="pre-footer-test__controls">
        <label>素材版本<select id="animation-source"><option value="video">网页视频 · 高清透明版约 16.0 MB</option><option value="lottie">原始 Lottie / 新版 JSON · 合计 85.7 MB</option></select></label>
        <button id="animation-restart" type="button">从头播放</button>
      </div>
      <p id="animation-state" role="status" aria-live="polite">正在准备预览…</p>
      <p class="pre-footer-test__mobile">本轮仅测试电脑版。手机动画待接入，此屏宽不会加载动画文件。</p>
    </div>
    <div id="pre-footer-demo"></div>
  </main>
  <div id="site-footer"></div>
</body>
</html>
